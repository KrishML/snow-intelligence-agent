[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-agent"
version = "0.1.0"
description = "Snow Intelligence Agent — Phase 1: Snow Intelligence Core"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.31.0",
    "alembic==1.16.2",
    "httpx==0.28.1",
    "pydantic-settings==2.13.1",
    "APScheduler==3.11.3",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.168.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-httpx==0.36.2",
    "aiosqlite==0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
