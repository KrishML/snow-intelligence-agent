[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snow-agent"
version = "0.1.0"
description = "Snow Intelligence Agent — Phase 1: Snow Intelligence Core"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.31.0",
    "alembic==1.16.2",
    "httpx==0.28.1",
    "pydantic-settings==2.13.1",
    "APScheduler==3.11.3",
    # ── Phase 2 ───────────────────────────────────────────────────────────────
    "langgraph==0.4.8",
    "langgraph-checkpoint==2.0.26",
    "langgraph-prebuilt==0.2.2",
    "langchain-openai==0.3.18",
    "langchain-core==0.3.61",
    "openai==1.82.1",
    "praw==7.8.1",
    "feedparser==6.0.11",
    "playwright==1.52.0",
    "pgvector==0.3.6",
    "python-telegram-bot==21.11.1",
    "sendgrid==6.11.0",
    "amadeus==9.0.0",
    "jinja2==3.1.6",
    "redis==8.1.0",
    "boto3==1.44.7",
    "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.168.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-httpx==0.36.2",
    "aiosqlite==0.21.0",
    "pytest-mock==3.14.0",
    "fakeredis==2.40.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
"app.delivery" = ["templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
