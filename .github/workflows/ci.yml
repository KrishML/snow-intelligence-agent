name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snow-agent
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: snow
          POSTGRES_PASSWORD: snow
          POSTGRES_DB: snow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snow -d snow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Name must contain "test": the PostgreSQL tests reset this database.
      TEST_DATABASE_URL: postgresql+asyncpg://snow:snow@localhost:5432/snow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: snow-agent/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrations apply, roll back and re-apply on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://snow:snow@localhost:5432/snow_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests (unit and PostgreSQL)
        run: pytest -q -ra

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snow-agent/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: snow-agent/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
